name: Sync fork with upstream

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync upstream
        run: gh repo sync ${{ github.repository }} --source FreshRSS/FreshRSS --branch edge
        env:
          # GITHUB_TOKEN cannot apply upstream changes under .github/workflows/.
          # Repo secret: classic PAT with repo + workflow, or fine-grained with
          # Contents and Workflows read/write on this repository.
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
